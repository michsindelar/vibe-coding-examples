[project]
name = "finance-research-agent"
version = "1.0.0"
description = "Stock & finance research agent: LangGraph + two composing MCP servers (keyless yfinance data + Python sandbox)"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langchain-anthropic>=1.5",
    "langchain-mcp-adapters>=0.3",
    "mcp>=1.20",
    "yfinance>=1.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
